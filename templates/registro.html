{% extends "base.html" %}

{% block title %}registro{% endblock %}

{% block content %}

<section class="hero">
    <div class="hero__content">
        <h1 class="hero__title">Crear cuenta</h1>
        <p class="hero__subtitle">registrate como usuario</p>
    </div>
</section>

<section class="search-section">
    <div class="search-card">
        <form method="POST" class="form">
            
            <div class="form__group">
                <label for="email" class="form__label">Email</label>
                <input type="email" id="email" name="email" class="form__input" required autofocus>
            </div>

            <div class="form__group">
                <label for="nombre" class="form__label">Nombre de usuario</label>
                <input type="text" id="nombre" name="nombre" class="form__input" required>
            </div>

            <div class="form__group">
                <label for="password" class="form__label">Contraseña</label>
                <input type="password" id="password" name="password" class="form__input" required>
            </div>

            <div class="form__actions form__actions--single">
                <button type="submit" class="form__btn form__btn--submit">Registrarme</button>
            </div>
        </form>

        <p class="search-card__subtitle" style="margin-top: 1rem;">
            ¿Ya tenés cuenta? <a href="#" class="link">Iniciá sesión</a>
        </p>
    </div>
</section>

{% endblock %}
