{% extends "base.html" %}
{% block title %}editar reseña{% endblock %}

{% block content %}

<h1>Editar reseña</h1>
<form method = "POST">
    <label>Comentario</label> 
    <textarea 
        name = "comentario"
        required>{{ reseña.comentario}}
    </textarea>
    <br><br>
    <label>Puntaje</label>
    <input 
        type = "number"
        name = "puntaje_estrellas"
        min = "1"
        max = "5"
        value = "{{ reseña.puntaje_estrellas }}"
        required
    >
    <br><br>
    <button type = "submit">Guardar cambios</button>
</form>

{%endblock%}
