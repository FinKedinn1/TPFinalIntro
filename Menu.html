<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú - La Taberna del Dragón</title>
    <!-- Hojas de estilo modularizadas -->
    <link rel="stylesheet" href="static/css/styles.css">
    <link rel="stylesheet" href="static/css/menu.css">
</head>

<body>

    <!-- Barra de Navegación Medieval -->
    <nav>
        <a href="index.html" class="nav-logo">🏰 La Taberna del Dragón</a>
        <ul>
            <li><a href="index.html#inicio">Inicio</a></li>
            <li><a href="Menu.html" style="color: var(--primary-gold);">Menú</a></li>
            <li><a href="index.html#historia">Historia</a></li>
            <li><a href="index.html#contacto">Contacto</a></li>
        </ul>
    </nav>

    <!-- Encabezado del Menú -->
    <header class="menu-header">
        <h1>Banquetes del Reino</h1>
        <p>Elige tu festín, noble guerrero. Servimos los platos más sabrosos de los siete reinos.</p>
    </header>

    <!-- Indicador de conexión con Backend (API) -->
    <div id="api-status-indicator" class="api-indicator warning">
        <span class="indicator-dot"></span>
        <span>Consultando el Pergamino del Rey...</span>
    </div>

    <!-- Botones de Filtrado de Categorías -->
    <div class="filters-container">
        <button class="filter-btn active" data-filter="all">⚔️ Todos los Banquetes</button>
        <button class="filter-btn" data-filter="plato-principal">🍗 Platos Principales</button>
        <button class="filter-btn" data-filter="entradas">🧀 Entradas</button>
        <button class="filter-btn" data-filter="sopas">🍲 Sopas</button>
        <button class="filter-btn" data-filter="bebidas">🍺 Bebidas</button>
        <button class="filter-btn" data-filter="postres">🍰 Postres</button>
        <button class="filter-btn" data-filter="vegetariano">🍃 Vegetariano</button>
    </div>

    <!-- Contenedor del Menú Dinámico -->
    <section style="padding: 20px 8% 80px 8%;">
        <div id="menu-container" class="menu-grid">
            <!-- Cargado dinámicamente mediante Javascript -->
        </div>
    </section>

    <!-- Pie de Página -->
    <footer>
        <p>⚔️ La Taberna del Dragón - Todos los derechos reservados ⚔️</p>
    </footer>

    <!-- Lógica de Conexión a Backend y Filtros Interactivos -->
    <script src="static/js/menu.js"></script>
</body>

</html>
